<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; background: white; }
  svg { display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="520" fill="white"/>

  <!-- ===== LLM Triage Head (top, parallel branch) ===== -->
  <rect x="420" y="30" width="260" height="80" rx="8" ry="8" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="550" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">LLM Triage Head</text>
  <text x="550" y="80" text-anchor="middle" font-size="12" fill="#555">Claude Sonnet + CodeQL</text>
  <text x="550" y="96" text-anchor="middle" font-size="11" fill="#777">Semantic analysis</text>

  <!-- Vertical arrow from Module 1 area up to LLM Triage -->
  <line x1="550" y1="270" x2="550" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dashed arrow from LLM Triage down to verdict area -->
  <path d="M 680 70 L 1480 70 L 1480 230" stroke="#666" stroke-width="1.8" stroke-dasharray="8,5" fill="none" marker-end="url(#arrow-dash)"/>
  <text x="1410" y="155" text-anchor="end" font-size="11" fill="#666" font-style="italic">Cross-validation</text>

  <!-- ===== Input arrow ===== -->
  <line x1="20" y1="310" x2="120" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="295" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Source Code</text>
  <text x="70" y="335" text-anchor="middle" font-size="11" fill="#555">(C/C++)</text>

  <!-- ===== Module 1: GNN Detection ===== -->
  <rect x="125" y="270" width="280" height="80" rx="8" ry="8" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <text x="265" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Module 1: GNN Detection</text>
  <text x="265" y="318" text-anchor="middle" font-size="12" fill="#555">ReGVD + LoRA + FAISS</text>
  <text x="265" y="336" text-anchor="middle" font-size="12" fill="#555">Hybrid Scoring</text>

  <!-- Arrow Module 1 → Module 2 -->
  <line x1="410" y1="310" x2="530" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="298" text-anchor="middle" font-size="11" fill="#333" font-style="italic">embedding</text>
  <text x="470" y="330" text-anchor="middle" font-size="11" fill="#555">(512-d)</text>

  <!-- ===== Module 2: Exploit Retrieval ===== -->
  <rect x="535" y="270" width="260" height="80" rx="8" ry="8" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <text x="665" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Module 2: Exploit Retrieval</text>
  <text x="665" y="318" text-anchor="middle" font-size="12" fill="#555">FAISS k-NN Search</text>
  <text x="665" y="336" text-anchor="middle" font-size="12" fill="#555">20 templates</text>

  <!-- Arrow Module 2 → Module 3 -->
  <line x1="800" y1="310" x2="920" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Module 3: LLM Adaptation ===== -->
  <rect x="925" y="270" width="260" height="80" rx="8" ry="8" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <text x="1055" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Module 3: LLM Adaptation</text>
  <text x="1055" y="318" text-anchor="middle" font-size="12" fill="#555">3-level cascade:</text>
  <text x="1055" y="336" text-anchor="middle" font-size="12" fill="#555">LLM → Template → Generic</text>

  <!-- Arrow Module 3 → Module 4 -->
  <line x1="1190" y1="310" x2="1300" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Module 4: Sandbox Verification ===== -->
  <rect x="1305" y="270" width="260" height="80" rx="8" ry="8" fill="#d8d8d8" stroke="#333" stroke-width="2.5"/>
  <text x="1435" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Module 4: Sandbox</text>
  <text x="1435" y="311" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Verification</text>
  <text x="1435" y="331" text-anchor="middle" font-size="11" fill="#555">Docker + ASan/MSan/TSan</text>
  <text x="1435" y="345" text-anchor="middle" font-size="11" fill="#555">+ LibFuzzer</text>

  <!-- ===== Dashed arrow: Module 4 back to Module 3 (retry) ===== -->
  <path d="M 1370 355 L 1370 410 L 1055 410 L 1055 355" stroke="#666" stroke-width="1.8" stroke-dasharray="8,5" fill="none" marker-end="url(#arrow-dash)"/>
  <text x="1210" y="430" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Compilation error → retry</text>

  <!-- ===== Output arrow with verdict ===== -->
  <line x1="1435" y1="270" x2="1435" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Verdict box -->
  <rect x="1330" y="140" width="220" height="50" rx="6" ry="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="1440" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Verdict</text>
  <text x="1440" y="178" text-anchor="middle" font-size="10" fill="#555">CONFIRMED | SUGGESTIVE</text>
  <text x="1440" y="190" text-anchor="middle" font-size="10" fill="#555">NEUTRAL | SAFE</text>

  <!-- ===== Stage numbers / flow labels ===== -->
  <text x="265" y="262" text-anchor="middle" font-size="10" fill="#999">Stage 1</text>
  <text x="665" y="262" text-anchor="middle" font-size="10" fill="#999">Stage 2</text>
  <text x="1055" y="262" text-anchor="middle" font-size="10" fill="#999">Stage 3</text>
  <text x="1435" y="262" text-anchor="middle" font-size="10" fill="#999">Stage 4</text>

  <!-- Funnel annotation -->
  <text x="800" y="480" text-anchor="middle" font-size="12" fill="#888" font-style="italic">Funnel: lightweight detection → heavy verification (only for suspicious code)</text>

</svg>
</body>
</html>
